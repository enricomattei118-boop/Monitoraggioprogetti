name: Monitoraggio progetti VIA

on:
  schedule:
    # 06:00, 10:00, 14:00, 18:00 ora italiana, coprendo sia CET (UTC+1, inverno)
    # che CEST (UTC+2, estate). Il controllo in main.py scarta comunque l'esecuzione
    # "doppia" nel giorno di cambio ora, eseguendo il report una sola volta per fascia.
    - cron: "0 5 * * *"   # 06:00 CET (inverno)
    - cron: "0 4 * * *"   # 06:00 CEST (estate)
    - cron: "0 9 * * *"   # 10:00 CET (inverno)
    - cron: "0 8 * * *"   # 10:00 CEST (estate)
    - cron: "0 13 * * *"  # 14:00 CET (inverno)
    - cron: "0 12 * * *"  # 14:00 CEST (estate)
    - cron: "0 17 * * *"  # 18:00 CET (inverno)
    - cron: "0 16 * * *"  # 18:00 CEST (estate)
  workflow_dispatch:
    inputs:
      forza_esecuzione:
        description: "Ignora il controllo orario ed esegui comunque (per test manuali)"
        required: false
        default: "true"

permissions:
  contents: write

concurrency:
  group: via-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Esegui monitoraggio
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_TO_EMAIL: ${{ secrets.REPORT_TO_EMAIL }}
          FORZA_ESECUZIONE: ${{ github.event.inputs.forza_esecuzione || 'false' }}
        run: python main.py

      - name: Commit nuovo stato
        run: |
          git config user.name "via-monitor-bot"
          git config user.email "actions@github.com"
          git add state/
          git diff --quiet --cached || git commit -m "Aggiorna stato progetti [skip ci]"
          git pull --rebase --autostash origin main
          git push
